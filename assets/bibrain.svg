<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" role="img" aria-label="BiBrain — in development">
<rect width="590" height="250" rx="16" fill="#f8f8f5"/>
<rect x="0.5" y="0.5" width="589" height="249" rx="16" fill="none" stroke="#111111" stroke-opacity="0.12"/>
<rect x="0" y="0" width="8" height="250" rx="4" fill="#d0645a"/>
<text x="40" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#111111">BiBrain</text>
<rect x="189" y="38" width="154" height="30" rx="15" fill="#c9722f" fill-opacity="0.18"/>
<circle cx="205" cy="53" r="5" fill="#c9722f"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="217" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111111">In development</text>
<text x="40" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#111111" fill-opacity="0.85">Your agents remember. You decide what’s true.</text>
<text x="40" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#111111" fill-opacity="0.7">A local-first second brain your AI agents keep current.</text>
<text x="40" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#111111" fill-opacity="0.7">Nothing becomes a fact until you keep it.</text>
<text x="40" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#d0645a">local-first  ·  capture  →  keep  →  recall</text>
</svg>